version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: yetech-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      MEDIA_ROOT: /app/media
      DOWNLOADS_ROOT: /app/downloads
      DB_PATH: /app/data/media.db
    volumes:
      - ./backend/media:/app/media
      - ./backend/downloads:/app/downloads
      - ./backend/data:/app/data
    networks:
      - yetech-net

  frontend:
    build:
      context: ./frontend
    container_name: yetech-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:3001
    networks:
      - yetech-net

networks:
  yetech-net:
    driver: bridge
